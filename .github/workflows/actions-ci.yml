name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-fabric:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev
          uv pip install -e .

      - name: Run unit tests
        run: uv run pytest tests/

      - name: Deploy Fabric
        run: |
          cd ansible/
          uv run ansible-playbook playbooks/deploy.yml
          cd ../

      - name: Run integration tests
        run: uv run pytest integration_tests/
