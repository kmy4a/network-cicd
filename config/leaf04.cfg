!
hostname leaf04
!
service routing protocols model multi-agent
!
no aaa root
!
interface Loopback0
   ip address 10.255.1.4/32
!
interface Ethernet63/1
   description Uplink to spine01
   no switchport
   ip address 10.0.0.7/31
!
interface Ethernet64/1
   description Uplink to spine02
   no switchport
   ip address 10.0.1.7/31
!
ip routing
!
ip route 192.168.4.0/24 Null0
!
router bgp 65103
   router-id 10.255.1.4
   maximum-paths 4
   !
   neighbor 10.0.0.6 remote-as 65000
   neighbor 10.0.0.6 description spine01
   !
   neighbor 10.0.1.6 remote-as 65001
   neighbor 10.0.1.6 description spine02
   !
   network 10.255.1.4/32
   network 192.168.4.0/24
!
end