!
hostname leaf01
!
service routing protocols model multi-agent
!
no aaa root
!
interface Loopback0
   ip address 10.255.1.1/32
!
interface Ethernet63/1
   description Uplink to spine01
   no switchport
   ip address 10.0.0.1/31
!
interface Ethernet64/1
   description Uplink to spine02
   no switchport
   ip address 10.0.1.1/31
!
ip routing
!
router bgp 65100
   router-id 10.255.1.1
   maximum-paths 4
   !
   neighbor 10.0.0.0 remote-as 65000
   neighbor 10.0.0.0 description spine01
   !
   neighbor 10.0.1.0 remote-as 65001
   neighbor 10.0.1.0 description spine02
   !
   network 10.255.1.1/32
!
end