!
hostname spine01
!
service routing protocols model multi-agent
!
no aaa root
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Ethernet1/1
   description Uplink to leaf01
   no switchport
   ip address 10.0.0.0/31
!
interface Ethernet2/1
   description Uplink to leaf02
   no switchport
   ip address 10.0.0.2/31
!
interface Ethernet3/1
   description Uplink to leaf03
   no switchport
   ip address 10.0.0.4/31
!
interface Ethernet4/1
   description Uplink to leaf04
   no switchport
   ip address 10.0.0.6/31
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65000
   router-id 10.255.0.1
   maximum-paths 4
   !
   neighbor 10.0.0.1 remote-as 65100
   neighbor 10.0.0.1 description leaf01
   !
   neighbor 10.0.0.3 remote-as 65101
   neighbor 10.0.0.3 description leaf02
   !
   neighbor 10.0.0.5 remote-as 65102
   neighbor 10.0.0.5 description leaf03
   !
   neighbor 10.0.0.7 remote-as 65103
   neighbor 10.0.0.7 description leaf04
   !
   network 203.0.113.0/24
   network 10.255.0.1/32
!
end