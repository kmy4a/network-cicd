!
hostname leaf02
!
service routing protocols model multi-agent
!
no aaa root
!
interface Loopback0
   ip address 10.255.1.2/32
!
interface Ethernet63/1
   description Uplink to spine01
   no switchport
   ip address 10.0.0.3/31
!
interface Ethernet64/1
   description Uplink to spine02
   no switchport
   ip address 10.0.1.3/31
!
ip routing
!
ip route 192.168.2.0/24 Null0
!
router bgp 65101
   router-id 10.255.1.2
   maximum-paths 4
   !
   neighbor 10.0.0.2 remote-as 65000
   neighbor 10.0.0.2 description spine01
   !
   neighbor 10.0.1.2 remote-as 65001
   neighbor 10.0.1.2 description spine02
   !
   network 10.255.1.2/32
   network 192.168.2.0/24
!
end